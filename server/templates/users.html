{% extends "base.html" %}

{% block title %}Управление сотрудниками{% endblock %}

{% block content %}
<div class="row">
    <!-- Форма добавления -->
    <div class="col-md-4 mb-4">
        <div class="card shadow-sm p-4 bg-white rounded">
            <h4 class="mb-3 text-primary">➕ Добавить сотрудника</h4>
            <form action="/admin/users/add" method="POST">
                <div class="mb-3">
                    <label class="form-label">ФИО сотрудника</label>
                    <input type="text" name="full_name" class="form-control" placeholder="Иванов И. И." required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Должность</label>
                    <input type="text" name="role" class="form-control" placeholder="кладовщик" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Сохранить в базу</button>
            </form>
        </div>
    </div>

    <!-- Список сотрудников с возможностью редактирования и удаления -->
    <div class="col-md-8">
        <div class="card shadow-sm p-4 bg-white rounded">
            <h4 class="mb-3 text-secondary">👥 Список персонала в базе данных</h4>
            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>ФИО</th>
                            <th>Должность</th>
                            <th class="text-end">Действия</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for user in users %}
                        <tr>
                            <td>{{ user.id }}</td>
                            <td class="fw-bold">{{ user.full_name }}</td>
                            <td>
                                <!-- Форма быстрого изменения должности -->
                                <form action="/admin/users/edit/{{ user.id }}" method="POST" class="d-inline-flex">
                                    <input type="text" name="role" value="{{ user.role }}" class="form-control form-control-sm me-2" style="width: 140px;">
                                    <button type="submit" class="btn btn-sm btn-outline-success">⚙️</button>
                                </form>
                            </td>
                            <td class="text-end">
                                <!-- Кнопка удаления -->
                                <a href="/admin/users/delete/{{ user.id }}" class="btn btn-sm btn-danger" onclick="return confirm('Вы уверены, что хотите удалить сотрудника из системы?')">🗑️ Удалить</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
